services:
  - type: web
    name: rapidapi-scrapers-hub
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LIVE_SCRAPING_ENABLED
        value: "false"
      - key: RAPIDAPI_PROXY_SECRET
        sync: false
